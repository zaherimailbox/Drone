{{define "sonar-audio"}}
<!-- Module: Sonar Acoustic & Mission Config Strip -->
        <article class="cockpit-module" style="flex: 0.5;">
          <div class="cockpit-module-header">
            <span class="module-badge"><span class="status-dot"></span>ACOUSTIC SONAR ENGINE</span>
            <span>ACTIVE</span>
          </div>
          <div class="cockpit-module-body">
            <div class="sonar-config-row">
              <div class="sonar-status-group">
                <div class="sonar-soundwave">
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                </div>
                <span class="sonar-tag">SONAR: 10.0 kHz PING</span>
              </div>
              <div class="sonar-mode-switch" role="group" aria-label="Sonar audio channels">
                <button class="sonar-mode-option" type="button" data-audio-mode="MUTE" aria-pressed="false">MUTE</button>
                <button class="sonar-mode-option" type="button" data-audio-mode="TX" aria-pressed="false">TX</button>
                <button class="sonar-mode-option" type="button" data-audio-mode="RX" aria-pressed="false">RX</button>
                <button class="sonar-mode-option active" type="button" data-audio-mode="BOTH" aria-pressed="true">TX/RX</button>
              </div>
            </div>

            <div class="mission-strip">
              <button class="btn-survey-action start">START GRID RUN</button>
              <button class="btn-survey-action">PAUSE</button>
              <button class="btn-survey-action">ABORT</button>
            </div>
          </div>
        </article>
{{end}}
